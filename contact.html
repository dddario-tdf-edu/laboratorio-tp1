<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto</title>

    <link rel="icon" href="favicon.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- NAVBAR (igual en todas las páginas) -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">Mi Blog</a>

            <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="menu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html">Acerca de mí</a></li>
                    <li class="nav-item"><a class="nav-link active" href="contact.html">Contacto</a></li>
                </ul>
            </div>
        </div>
    </nav>
    <main class="container py-5">
        <h1>Contacto</h1>

        <form action="gracias.html">

            <!-- NOMBRE -->
            <div class="mb-3">
                <label for="nombre" class="form-label">Nombre</label>
                <input type="text" id="nombre" class="form-control" required minlength="3" maxlength="30"
                    pattern="[A-Za-zÁÉÍÓÚáéíóúÑñ\s]+" placeholder="Ej: Juan Pérez"
                    title="Solo letras y espacios, mínimo 3 caracteres">
                <div class="invalid-feedback">
                    Ingresa un nombre válido (solo letras).
                </div>
            </div>

            <!-- EMAIL -->
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" id="email" class="form-control" required placeholder="ejemplo@mail.com"
                    title="Ingresa un email válido">
                <div class="invalid-feedback">
                    Ingresa un email válido.
                </div>
            </div>

            <!-- TELÉFONO -->
            <div class="mb-3">
                <label for="telefono" class="form-label">Teléfono</label>
                <input type="tel" id="telefono" class="form-control" required pattern="[0-9]{8,15}"
                    placeholder="Ej: 1122334455" title="Solo números, entre 8 y 15 dígitos">
                <div class="invalid-feedback">
                    Solo números (8 a 15 dígitos).
                </div>
            </div>

            <!-- MENSAJE -->
            <div class="mb-3">
                <label for="mensaje" class="form-label">Mensaje</label>
                <textarea id="mensaje" class="form-control" rows="4" required minlength="10" maxlength="300"
                    placeholder="Escribe tu mensaje..." title="Mínimo 10 caracteres"></textarea>
                <div class="invalid-feedback">
                    El mensaje debe tener al menos 10 caracteres.
                </div>
            </div>

            <button class="btn btn-primary">Enviar</button>

        </form>
    </main>

    <!-- FOOTER -->
    <footer class="bg-dark text-white py-4 mt-5">
        <div class="container text-center">

            <!-- Texto -->
            <p class="mb-2">© 2026 Mi Blog</p>

            <!-- Redes -->
            <div class="mb-3">
                <a href="https://github.com/dddario-tdf-edu" class="text-white me-3" target="_blank"
                    aria-label="GitHub">
                    GitHub
                </a>

                <a href="mailto:dariocabrera93@gmail.com" class="text-white me-3" aria-label="Enviar email">
                    Email
                </a>

                <a href="#" class="text-white" aria-label="LinkedIn">
                    LinkedIn
                </a>
            </div>

            <!-- Extra -->
            <small>Hecho con HTML5, CSS y Bootstrap 5</small>

        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
